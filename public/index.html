<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-adsense-account" content="ca-pub-4214732111289465" />
    <link rel="canonical" href="https://sitey.my/" />
    <link rel="icon" href="/favicon-32.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link
      rel="preload"
      href="/logo-64.png"
      as="image"
      type="image/png"
    />
    <title>Sitey - free domain</title>
    <meta
      name="description"
      content="Get a free subdomain in seconds. Create A, CNAME and TXT records and manage them from a simple dashboard."
    />
    <meta
      name="keywords"
      content="sitey.my, sitey.one, free subdomain, domain, dns management, free domain, domain checker"
    />
    <meta name="author" content="Sitey" />
    <meta name="theme-color" content="#008080" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sitey - Free Domain for Developers" />
    <meta property="og:description" content="Get a free subdomain in seconds. Create DNS records and manage them from a simple dashboard." />
    <meta property="og:url" content="https://sitey.my/" />
    <meta property="og:image" content="https://sitey.my/sitey_logo.png" />
    <meta property="og:site_name" content="Sitey" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Sitey - Free Domain for Developers" />
    <meta name="twitter:description" content="Get a free subdomain in seconds. Create DNS records and manage them from a simple dashboard." />
    <meta name="twitter:image" content="https://sitey.my/sitey_logo.png" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Sitey",
      "url": "https://sitey.my",
      "description": "Free subdomain service for developers. Create DNS records and manage domains from a simple dashboard.",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <link rel="stylesheet" href="/style.css" />
    <script src="/script.js" type="module" defer></script>
  </head>
  <body>
    <div class="container">
      <div id="navbar"></div>
      <main id="app-root"></main>
      <div id="footer"></div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <!-- Desktop furniture. The Start button opens a real menu, so it is a
         button and not aria-hidden; the task label and clock still say nothing
         a screen reader needs, and stay hidden from it. -->
    <div class="taskbar">
      <button
        type="button"
        class="taskbar-start"
        id="start-button"
        aria-expanded="false"
        aria-controls="start-menu"
      >
        <span class="taskbar-flag" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span data-i18n="taskbar.start">Start</span>
      </button>
      <div class="taskbar-tasks" aria-hidden="true"><span id="taskbar-window">sitey.my</span></div>
      <div class="taskbar-tray" id="taskbar-clock" aria-hidden="true">--:--</div>
    </div>

    <!-- Start menu. Hidden until the button is pressed. The left rail is the
         98 detail people recognise before they read anything. -->
    <div class="start-menu hidden" id="start-menu" role="menu" aria-labelledby="start-button">
      <div class="start-rail" aria-hidden="true"><span>sitey</span></div>
      <ul class="start-items">
        <li><a role="menuitem" href="/" data-link data-i18n="start.new">New address</a></li>
        <li><a role="menuitem" href="/docs" data-link data-i18n="start.docs">Documents</a></li>
        <li><a role="menuitem" href="/help" data-link data-i18n="start.help">Help</a></li>
        <li class="start-sep" role="separator"></li>
        <!-- Buy Me a Coffee, their own widget, their own markup.
             Deliberately of another decade: a rounded yellow pill in a
             handwriting face inside a 98 window. That contrast is the joke the
             whole skin is built on (Jay), so it is not restyled.

             It sits inline rather than being injected on first open: the
             widget draws itself relative to its own script tag, and appending
             it later leaves an empty row. -->
        <li class="start-coffee" id="start-coffee">
          <script
            type="text/javascript"
            src="https://cdnjs.buymeacoffee.com/1.0.0/button.prod.min.js"
            data-name="bmc-button"
            data-slug="helpmeup"
            data-color="#FFDD00"
            data-emoji="☕"
            data-font="Cookie"
            data-text="Buy me a coffee"
            data-outline-color="#000000"
            data-font-color="#000000"
            data-coffee-color="#ffffff"
          ></script>
        </li>
        <li class="start-sep" role="separator"></li>
        <li><a role="menuitem" href="/login" data-link data-i18n="start.login">Log in</a></li>
      </ul>
    </div>

    <!-- Create Modal -->
    <div
      id="create-modal"
      class="modal hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="create-modal-title"
    >
      <div class="modal-backdrop" data-modal-close></div>
      <div class="modal-content">
        <button
          type="button"
          class="modal-close"
          id="create-modal-close"
          aria-label="Close create modal"
        >
          &times;
        </button>
        <h2 id="create-modal-title" data-i18n="modal.create.title">Create domain</h2>
        <p class="modal-subtitle">
          <span data-i18n="modal.create.subtitle">You are about to create</span>
          <strong id="create-modal-domain"></strong>
        </p>
        <form id="create-modal-form" novalidate>
          <div class="field-label">
            <label for="create-modal-type" class="form-label" data-i18n="modal.create.type_label">Record type</label>
            <button
              type="button"
              class="tooltip-toggle"
              id="create-modal-type-info"
              aria-label="Learn about record types"
              aria-expanded="false"
              aria-controls="create-modal-type-tooltip"
            >
              <span aria-hidden="true">i</span>
            </button>
            <div
              class="tooltip-bubble"
              id="create-modal-type-tooltip"
              role="tooltip"
            >
              Choose how this domain should resolve.
            </div>
          </div>
          <div class="input-group">
            <select id="create-modal-type" class="input-select">
              <option value="A">A (IPv4)</option>
              <option value="CNAME">CNAME</option>
            </select>
          </div>
          <label
            for="create-modal-value"
            class="form-label"
            id="create-modal-value-label"
            >A record (IPv4)</label
          >
          <div class="input-group">
            <input
              type="text"
              id="create-modal-value"
              placeholder="e.g. 203.0.113.10"
              required
              autocomplete="off"
              spellcheck="false"
              autocapitalize="none"
            />
          </div>
          <p class="field-helper" id="create-modal-helper">
            Maps this domain to an IPv4 address.
          </p>
          <button
            type="submit"
            class="primary-button"
            id="create-modal-submit"
          >
            <span data-i18n="modal.create.submit">Create domain</span>
          </button>
        </form>
      </div>
    </div>

    <!-- Page Templates -->
    <template id="template-home">
      <section class="hero">
        <h1 data-i18n="hero.title">Get your free domain</h1>
        <p class="subtitle">
          <span data-i18n="hero.subtitle.prefix">with</span> <span id="domain-list-span" aria-live="polite">Loading...</span>
        </p>
        <form id="subdomain-form" novalidate>
          <fieldset class="groupbox">
            <legend data-i18n="home.group.legend">New domain</legend>
            <div class="search-box">
              <label for="subdomain" data-i18n="home.name_label">Name</label>
              <input
                type="text"
                id="subdomain"
                data-i18n-placeholder="hero.search.placeholder"
                placeholder="Enter your desired domain"
                required
                pattern="^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
                autocomplete="off"
                spellcheck="false"
                autocapitalize="none"
              />
              <button type="submit" id="check-btn" data-i18n="hero.search.button">Check</button>
            </div>
            <div class="results-section">
              <div
                id="availability-results"
                class="hidden"
                aria-live="polite"
              ></div>
            </div>
          </fieldset>
        </form>
        <!-- Agents reach us over MCP, so there is nothing here for them to
             click - one line to the docs is the whole interface they need. -->
        <p class="home-agent-line" data-i18n="home.agent_line" data-i18n-html>
          You can create one from code too &mdash; see the <a href="/docs">docs</a>.
        </p>
        <div class="statusbar domain-badge">
          <span aria-live="polite" aria-atomic="true">
            <span data-i18n="hero.badge">Active domains:</span> <span id="domain-count-number">--</span>
          </span>
          <span data-i18n="home.status.free">3 free by default</span>
          <span data-i18n="home.status.renew">Renewed every 3 months</span>
        </div>
      </section>
      <section class="features">
        <h2 data-i18n="features.title">What We Deliver</h2>
        <div class="feature-grid">
          <article class="feature-card">
            <h3 data-i18n="features.speed.title">Speed</h3>
            <p data-i18n="features.speed.desc">Claim a custom domain on our nameserver in seconds. No registrar, no waiting.</p>
          </article>
          <article class="feature-card">
            <h3 data-i18n="features.control.title">Control</h3>
            <p data-i18n="features.control.desc">Update DNS targets from your dashboard without touching a registrar panel.</p>
          </article>
          <article class="feature-card">
            <h3 data-i18n="features.security.title">Security</h3>
            <p data-i18n="features.security.desc">Manage changes securely through your own credentials with validated records.</p>
          </article>
        </div>
      </section>
    </template>

    <template id="template-login">
      <div class="form-card" style="text-align: center;">
        <h1 data-i18n="login.title">Log In</h1>
        <p class="form-subtitle" data-i18n="login.subtitle">Sign in with your Google account to manage domains.</p>
        <button type="button" id="google-login-btn" class="google-login-button">
          <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/><path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/></svg>
          <span data-i18n="login.google">Continue with Google</span>
        </button>
      </div>
    </template>

    <template id="template-dashboard">
      <div class="dashboard-section">
        <h1 data-i18n="dashboard.title">My Domains</h1>
        <p class="dashboard-subtitle" data-i18n="dashboard.subtitle">Manage your active domains below.</p>
        <div id="dashboard-list" class="dashboard-list-container">
          <p>Loading your domains...</p>
        </div>
      </div>
    </template>

    <template id="template-docs">
      <div class="docs-layout">
        <aside class="docs-sidebar" id="docs-sidebar">
          <nav aria-label="Documentation">
            <ul>
              <li><a href="#quick-start" class="docs-link active" data-doc="quick-start" data-i18n="docs.nav.quickstart">Quick Start</a></li>
              <li><a href="#vercel" class="docs-link" data-doc="vercel" data-i18n="docs.nav.vercel">Vercel Setup</a></li>
              <li><a href="#record-types" class="docs-link" data-doc="record-types" data-i18n="docs.nav.records">Record Types</a></li>
            </ul>
          </nav>
        </aside>
        <div class="docs-content" id="docs-content">
          <!-- Filled by JS -->
        </div>
      </div>
    </template>

    <template id="template-blog">
      <article class="blog-article" id="blog-content">
        <!-- Rendered by modules/blog.js -->
      </article>
    </template>

    <template id="template-help">
      <div class="content-page">
        <h1 data-i18n="help.title">Help & Support</h1>
        <p class="page-subtitle" data-i18n="help.subtitle">We're here to help with setup, troubleshooting, and feature requests.</p>
        <div class="content-section">
          <h2 data-i18n="help.contact.title">Contact</h2>
          <p data-i18n="help.contact.desc" data-i18n-html>Need assistance? Message the team on <a href="https://t.me/+yvrIFDbssJ0wNDJl" target="_blank" rel="noopener noreferrer">Telegram</a>.</p>

          <div class="support-cta">
            <h3 data-i18n="help.support.title">Support the project</h3>
            <p data-i18n="help.support.desc">Every domain is free. Consider buying the developer a coffee.</p>
            <div class="support-actions">
              <a class="donate-button" href="https://www.buymeacoffee.com/helpmeup" target="_blank" rel="noopener noreferrer" data-i18n="help.support.button">Buy me a coffee</a>
            </div>
          </div>
        </div>
      </div>
    </template>
  </body>
</html>
