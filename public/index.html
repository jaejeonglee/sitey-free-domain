<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-adsense-account" content="ca-pub-4214732111289465" />
    <link rel="canonical" href="https://sitey.my/" />
    <link rel="icon" href="/favicon-32.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The saved choice has to land on <html> before the first paint, or a
         visitor who picked dark gets a white page for as long as the deferred
         module takes to run. Everything else about the theme lives in
         modules/theme.js; this is only the part that cannot wait. -->
    <script>
      try {
        var t = localStorage.getItem("sitey-theme");
        if (t === "dark" || t === "light") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@300;400;500;700&family=Inter:wght@400;500;600;700&display=swap"
    />

    <title>Sitey — your AI-built site, on your own address</title>
    <meta
      name="description"
      content="Put the site you built with AI on your own address in 30 seconds. No sign-up. Point a name at Vercel, Netlify, GitHub Pages, Lovable or your server — or let your agent do it over MCP."
    />
    <meta
      name="keywords"
      content="custom address for vercel app, address for ai-built site, lovable custom domain, netlify custom domain, mcp dns, agent subdomain, sitey.my"
    />
    <meta name="author" content="Sitey" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1214" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sitey — your AI-built site, on your own address" />
    <meta property="og:description" content="30 seconds. No sign-up. Agents welcome. Point a name at Vercel, Netlify, GitHub Pages, Lovable or your server." />
    <meta property="og:url" content="https://sitey.my/" />
    <meta property="og:image" content="https://sitey.my/sitey_logo.png" />
    <meta property="og:site_name" content="Sitey" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Sitey — your AI-built site, on your own address" />
    <meta name="twitter:description" content="30 seconds. No sign-up. Agents welcome. Point a name at Vercel, Netlify, GitHub Pages, Lovable or your server." />
    <meta name="twitter:image" content="https://sitey.my/sitey_logo.png" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Sitey",
      "url": "https://sitey.my",
      "description": "Puts a site built with AI on its own address in 30 seconds, without sign-up. People and their agents (over MCP) point a name at Vercel, Netlify, GitHub Pages, Lovable or a server.",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>

    <!-- Open Runde: Inter 의 둥근 변형, OFL-1.1. 구글 폰트에 없어 fontsource 를 쓴다.
         index.css 는 400 한 벌만 싣는데 제목은 전부 700 이라, 브라우저가 400 을
         뭉개 굵게 «합성»하고 있었다. 획이 뭉개져서 서체가 안 먹은 것처럼 보인다.
         쓰는 굵기가 700 하나뿐이므로 그 한 벌만 부른다 — 파일도 하나 줄었다. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@fontsource/open-runde@5/700.css"
    />
    <link rel="stylesheet" href="/style.css" />
    <script src="/script.js" type="module" defer></script>

    <!-- The AdSense loader, and nothing else: this is the tag the site
         review looks for, alongside the google-adsense-account meta above.
         The document carries no ad slot element, so nothing is filled
         and no advert is drawn. -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4214732111289465"
         crossorigin="anonymous"></script>
  </head>
  <body>
    <header id="navbar"></header>
    <main id="app-root"></main>

    <!-- The footer is markup, not a render: static means a crawler sees
         these links. The coffee link used to be the official yellow widget,
         and it was the loudest thing on the first screen (2026-10-01) — a
         small text link says the same without looking like a hobby page. -->
    <footer>
      <a
        href="https://t.me/+yvrIFDbssJ0wNDJl"
        target="_blank"
        rel="noopener noreferrer"
        data-i18n="nav.contact"
        >Contact</a
      >
      <a href="/blog" data-i18n="nav.blog">Blog</a>
      <a href="/about" data-i18n="nav.about">About</a>
      <a href="/privacy" data-i18n="nav.privacy">Privacy</a>
      <a
        class="footer-end"
        href="https://www.buymeacoffee.com/helpmeup"
        target="_blank"
        rel="noopener noreferrer"
        data-i18n="nav.coffee"
        >Buy me a coffee</a
      >
    </footer>

    <div id="toast-container" class="toast-container"></div>

    <!-- Create Modal -->
    <div
      id="create-modal"
      class="modal hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="create-modal-title"
    >
      <div class="modal-backdrop" data-modal-close></div>
      <div class="modal-content">
        <button
          type="button"
          class="modal-close"
          id="create-modal-close"
          aria-label="Close create modal"
        >
          &times;
        </button>
        <h2 id="create-modal-title" data-i18n="modal.create.title">Create domain</h2>
        <p class="modal-subtitle">
          <span data-i18n="modal.create.subtitle">You are about to create</span>
          <strong id="create-modal-domain"></strong>
        </p>
        <form id="create-modal-form" novalidate>
          <div class="field-label">
            <label for="create-modal-type" class="form-label" data-i18n="modal.create.type_label">Record type</label>
            <button
              type="button"
              class="tooltip-toggle"
              id="create-modal-type-info"
              aria-label="Learn about record types"
              aria-expanded="false"
              aria-controls="create-modal-type-tooltip"
            >
              <span aria-hidden="true">i</span>
            </button>
            <div
              class="tooltip-bubble"
              id="create-modal-type-tooltip"
              role="tooltip"
            >
              Choose how this domain should resolve.
            </div>
          </div>
          <div class="input-group">
            <select id="create-modal-type" class="input-select">
              <option value="A">A (IPv4)</option>
              <option value="CNAME">CNAME</option>
              <option value="REDIRECT">Redirect (URL)</option>
            </select>
          </div>
          <label
            for="create-modal-value"
            class="form-label"
            id="create-modal-value-label"
            >A record (IPv4)</label
          >
          <div class="input-group">
            <input
              type="text"
              id="create-modal-value"
              placeholder="e.g. 203.0.113.10"
              required
              autocomplete="off"
              spellcheck="false"
              autocapitalize="none"
            />
          </div>
          <p class="field-helper" id="create-modal-helper">
            Maps this domain to an IPv4 address.
          </p>
          <button
            type="submit"
            class="primary-button"
            id="create-modal-submit"
          >
            <span data-i18n="modal.create.submit">Create domain</span>
          </button>
        </form>
      </div>
    </div>

    <!-- Privacy Modal — the policy lives at /privacy as a real page for
         crawlers; this is the same text opened over the page for a reader. -->
    <div
      id="privacy-modal"
      class="modal hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="privacy-modal-title"
    >
      <div class="modal-backdrop" data-modal-close></div>
      <div class="modal-content privacy-modal-content">
        <button
          type="button"
          class="modal-close"
          data-modal-close
          aria-label="Close"
        >
          &times;
        </button>
        <!-- The markdown carries its own heading, so this one only labels
             the dialog for assistive tech. -->
        <h2 id="privacy-modal-title" class="sr-only" data-i18n="nav.privacy">Privacy</h2>
        <div id="privacy-modal-body" class="blog-body"></div>
      </div>
    </div>

    <!-- Page Templates -->
    <template id="template-home">
      <div class="stage">
        <!-- 히어로는 판이다: 파란 면 위에 이름과 검색이 올라간다. -->
        <div class="hero-panel">
        <!-- The name is a mark, not the heading. The heading is what the
             service does — a first-time visitor saw a logo and an input box
             and had to guess (2026-10-01). -->
        <p class="wordmark">sitey</p>
        <h1 class="hero-title" data-i18n="home.title">Your AI-built site, on your own address.</h1>
        <p class="hero-sub" data-i18n="home.subtitle">30 seconds. No sign-up. Agents welcome.</p>

        <!-- No Check button: typing is the whole gesture, and the one thing
             left to press is the button that actually registers a name.
             The form stays so that Enter searches at once instead of
             reloading the page. -->
        <form id="subdomain-form" novalidate>
          <div class="field">
            <input
              type="text"
              id="subdomain"
              data-i18n-placeholder="home.placeholder"
              data-i18n-aria="home.input_label"
              aria-label="Name you want"
              placeholder="Check a name first — no sign-up needed"
              required
              pattern="^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
              autocomplete="off"
              spellcheck="false"
              autocapitalize="none"
            />
            <select
              id="domain-preference"
              data-i18n-aria="home.select_label"
              aria-label="Domain to check first"
            ></select>
          </div>
        </form>
        <div class="bar" id="search-bar" aria-hidden="true"><i></i></div>

        </div>

        <div id="availability-results" class="results" aria-live="polite"></div>

        <!-- The line an agent user needs: what to paste, and where the server
             is. Text, not a picture of text, so it can be copied. -->
        <div class="agent-line">
          <div class="agent-text">
            <p class="agent-label" data-i18n="home.agent.label">Paste into Claude or Cursor</p>
            <div class="agent-copy">
              <code id="agent-prompt" data-i18n="home.agent.prompt">Use the sitey MCP to point myapp.sitey.my at my Vercel project</code>
              <button type="button" class="agent-copy-btn" id="agent-copy" data-i18n="home.agent.copy">Copy</button>
            </div>
            <p class="agent-links">
              <span data-i18n="home.agent.server">MCP server</span>
              <code>https://sitey.my/mcp</code>
              <a href="/.well-known/mcp.json">mcp.json</a>
              <a href="/llms.txt">llms.txt</a>
              <a href="/docs" data-i18n="nav.docs">Docs</a>
            </p>
          </div>
          <div class="mock mock-agent" aria-hidden="true">
            <p class="mock-said" data-i18n="home.mock.ask">Get me an address</p>
            <div class="mock-call">
              <span class="mock-chip">MCP</span>
              <span class="mock-host">create_subdomain</span>
            </div>
            <p class="mock-said mock-said-back"><span class="mock-host">demo.sitey.my</span></p>
          </div>
        </div>

        <!-- 카드마다 «그 단계에서 실제로 보이는 화면»을 작게 넣는다.
             삽화가 아니라 사이티 자기 화면의 축소판이고, 그림 파일이 아니라
             CSS 로 그려서 첫 화면 무게가 늘지 않는다. -->
        <h2 class="steps-title" data-i18n="home.how.title">How it works</h2>
        <ol class="points">
          <li>
            <div class="mock mock-find" aria-hidden="true">
              <div class="mock-input"><span class="mock-host">myapp</span><span class="mock-caret"></span></div>
              <div class="mock-hit"><span class="mock-host">myapp.sitey.my</span><span class="mock-tick"></span></div>
            </div>
            <h3 data-i18n="home.how.pick.title">1. Pick a name</h3>
            <p data-i18n="home.how.pick.desc">Type it. If it's free, it's yours — no account needed to look.</p>
          </li>
          <li>
            <div class="mock mock-record" aria-hidden="true">
              <div class="mock-head">
                <span class="mock-host">myapp.sitey.my</span>
                <span class="mock-chip">CNAME</span>
              </div>
              <div class="mock-target"><span class="mock-arrow">&#8594;</span> cname.vercel-dns.com</div>
              <div class="mock-hosts">
                <span>Vercel</span><span>Netlify</span><span>GitHub Pages</span><span>Lovable</span><span data-i18n="home.how.where.server">your server</span>
              </div>
            </div>
            <h3 data-i18n="home.how.where.title">2. Tell us where it's hosted</h3>
            <p data-i18n="home.how.where.desc">Paste the address your host gave you — Vercel, Netlify, GitHub Pages, Lovable, or your own server's IP.</p>
          </li>
          <li>
            <div class="mock mock-done" aria-hidden="true">
              <div class="mock-bar"><span class="mock-lock"></span><span class="mock-host">https://myapp.sitey.my</span></div>
              <div class="mock-foot">
                <span class="mock-dot"></span>
                <span data-i18n="home.mock.live">Live</span>
              </div>
            </div>
            <h3 data-i18n="home.how.done.title">3. Done</h3>
            <p data-i18n="home.how.done.desc">Your site answers on the new address, usually within a minute.</p>
          </li>
        </ol>

      </div>
    </template>

    <template id="template-login">
      <div class="form-card" style="text-align: center;">
        <h1 data-i18n="login.title">Log In</h1>
        <p class="form-subtitle" data-i18n="login.subtitle">Sign in with your Google account to manage domains.</p>
        <button type="button" id="google-login-btn" class="google-login-button">
          <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/><path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/><path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/><path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/></svg>
          <span data-i18n="login.google">Continue with Google</span>
        </button>
      </div>
    </template>

    <template id="template-dashboard">
      <div class="dashboard-section">
        <h1 data-i18n="dashboard.title">My Domains</h1>
        <p class="dashboard-subtitle" data-i18n="dashboard.subtitle">Manage your active domains below.</p>
        <div id="dashboard-list" class="dashboard-list-container">
          <p>Loading your domains...</p>
        </div>
      </div>
    </template>

    <template id="template-docs">
      <div class="docs-layout">
        <aside class="docs-sidebar" id="docs-sidebar">
          <nav aria-label="Documentation">
            <ul>
              <li><a href="#quick-start" class="docs-link active" data-doc="quick-start" data-i18n="docs.nav.quickstart">Quick Start</a></li>
              <li><a href="#vercel" class="docs-link" data-doc="vercel" data-i18n="docs.nav.vercel">Vercel Setup</a></li>
              <li><a href="#record-types" class="docs-link" data-doc="record-types" data-i18n="docs.nav.records">Record Types</a></li>
              <li><a href="#limits" class="docs-link" data-doc="limits" data-i18n="docs.nav.limits">Limits &amp; Expiry</a></li>
            </ul>
          </nav>
          <p class="docs-machine">
            <a href="/openapi.json" data-i18n="docs.nav.openapi">API spec (OpenAPI)</a>
            <a href="/llms.txt" data-i18n="docs.nav.llms">llms.txt</a>
          </p>
        </aside>
        <div class="docs-content" id="docs-content">
          <!-- Filled by JS -->
        </div>
      </div>
    </template>

    <template id="template-blog">
      <article class="blog-article" id="blog-content">
        <!-- Rendered by modules/blog.js -->
      </article>
    </template>
  </body>
</html>
